services:
  db:
    image: mariadb:11.4
    container_name: brazil-locations-db
    environment:
      MARIADB_ROOT_PASSWORD: root_local
      MARIADB_DATABASE: locations
      MARIADB_USER: locations
      MARIADB_PASSWORD: locations_local
    ports:
      - "127.0.0.1:3312:3306"
    volumes:
      - locations-db:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7-alpine
    container_name: brazil-locations-cache
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: brazil-locations-app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: locations
      DB_USER: locations
      DB_PASS: locations_local
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      CACHE_TTL: 86400
    ports:
      - "127.0.0.1:8130:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  locations-db:
